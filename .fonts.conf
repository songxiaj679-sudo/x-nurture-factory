<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Windows / macOS 日本語・欧文標準フォントのメトリクス整合エイリアス -->
  <alias>
    <family>Yu Gothic</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>YuGothic</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>Yu Gothic UI</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>Meiryo</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>Meiryo UI</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>MS PGothic</family>
    <prefer><family>IPAPGothic</family><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias>
    <family>MS Gothic</family>
    <prefer><family>IPAGothic</family><family>Noto Sans Mono CJK JP</family></prefer>
  </alias>
  <alias>
    <family>Hiragino Sans</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>Hiragino Kaku Gothic ProN</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Noto Sans CJK JP</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>Noto Sans CJK JP</family><family>IPAPGothic</family></prefer>
  </alias>
</fontconfig>
